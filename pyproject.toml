[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-runtime"
version = "0.1.0.dev0"
description = "A learning-oriented single-GPU LLM inference runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.7",
  "transformers>=4.46,<5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

